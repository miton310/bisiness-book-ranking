name: Update Book Rankings

on:
  push:
    branches:
      - main
  # schedule:
  #   - cron: '0 0 * * *'  # 毎日1回（UTC 0:00 = JST 9:00）
  workflow_dispatch:  # 手動実行

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch videos and extract books
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_videos.py

      - name: Copy data to frontend
        run: cp data/{books,rankings,rankings_views,rankings_likes,channels}.json frontend/public/data/

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update book rankings [skip ci]"
          git push
        # Cloudflare PagesがGitHubと連携済みなので、pushすると自動でビルド・デプロイされる
